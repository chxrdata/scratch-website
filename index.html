<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fractal Flowers</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Geist+Mono:ital,wght@0,100..900;1,100..900&family=Geist:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="tree-links-container"></div>
    <canvas id="treeCanvas">
        Your browser does not support the HTML canvas tag.
    </canvas>
    <div id="intro-animation-container">
        <div id="intro-label"></div>
        <div id="intro-animation">
            <div class="intro-btn" id="intro-all-btn"></div>
            <div class="intro-btn" id="intro-dataviz-btn"></div>
            <div class="intro-btn" id="intro-exhibition-btn"></div>
            <div class="intro-btn" id="intro-uiux-btn"></div>
            <div class="intro-btn" id="intro-publication-btn"></div>
        </div>
    </div>
    <div id="home-about-mobile">
        <h1>Del Cro is an information designer exploring the intersection of natural systems and human
            curiosity.
        </h1>
    </div>
    <div class="homescreen-main">
        <div class="nav-bar-desktop">
            <img class="nav-bar-logo" src="assets/logo.svg" alt="Del Cro Logo">
            <div class="nav-menu-desktop">
                <a>Work</a>
                <a>About</a>
                <a>Resources</a>
            </div>
        </div>
        <div class="column">
            <div id="home-about-desktop">
                <p>Del Cro is an information designer exploring the intersection of natural systems and human
                    curiosity.</p>
                <div class="social-links">
                    <a class="email-link"></a>
                    <a class="linkedin-link"></a>
                    <a class="instagram-link"></a>
                </div>

            </div>
        </div>

        <div class="column">
            <div id="tree-form-container">
                <h1 id="form-header">All Work</h1>
                <form>
                    <div>
                        <label id="range-label" for="tr-range-1">Water</label>
                        <input type="range" id="tr-range-1" name="tr-range-1" min="0" max="100" value="50">
                    </div>
                    <div>
                        <label id="range-label" for="tr-range-2">Sunlight</label>
                        <input type="range" id="tr-range-2" name="tr-range-2" min="0" max="100" value="75">
                    </div>
                </form>
                <div class="seed-btns-container">
                    <div class="seed-btn" id="tree-all-btn"></div>
                    <div class="seed-btn" id="tree-dataviz-btn"></div>
                    <div class="seed-btn" id="tree-exhibition-btn"></div>
                    <div class="seed-btn" id="tree-uiux-btn"></div>
                    <div class="seed-btn" id="tree-publication-btn"></div>
                </div>
            </div>
        </div>
        <div class="column">
            <div id="home-thumbnail-popup"></div>
        </div>
    </div>

    <script src="app.js"></script>

</body>

</html>
