<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fractal Flowers</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Geist+Mono:ital,wght@0,100..900;1,100..900&family=Geist:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <canvas id="treeCanvas">
        Your browser does not support the HTML canvas tag.
    </canvas>
    <div class="homescreen-main">
        <div class="column">
            <div class="sitemap-boxes">
            </div>
        </div>
        <div class="column">
            <div class="tree-form-container">
                <h1><i>Myosotis exhibitionides</i></h1>
                <form>
                    <div>
                        <label id="range-label" for="tr-range-1">Water</label>
                        <input type="range" id="tr-range-1" name="tr-range-1" min="0" max="100" value="50">
                    </div>
                    <div>
                        <label id="range-label" for="tr-range-2">Sunlight</label>
                        <input type="range" id="tr-range-2" name="tr-range-2" min="0" max="100" value="75">
                    </div>
                </form>
                <div class="seed-btns-container">
                    <div class="seed-btn" id="tree-all-btn"></div>
                    <div class="seed-btn" id="tree-dataviz-btn"></div>
                    <div class="seed-btn" id="tree-exhibition-btn"></div>
                    <div class="seed-btn" id="tree-uiux-btn"></div>
                    <div class="seed-btn" id="tree-publication-btn"></div>
                </div>
            </div>
        </div>
        <div class="column"></div>
    </div>

    <script src="app.js"></script>

</body>

</html>
